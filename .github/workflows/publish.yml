name: Publish

# Publishes @jylups/flowable-bpmn-moddle when a GitHub release is published.
#
# The release tag must match the package.json version, with or without a
# leading v (0.1.0 or v0.1.0 for 0.1.0). A prerelease version such as
# 0.1.0-next.0 is published under the npm dist-tag "next", so "latest" keeps
# pointing to the last stable version.
#
# npm authenticates this workflow with trusted publishing (OIDC), so no npm
# token is stored in the repository. The package's trusted publisher on
# npmjs.com must name the GitHub user jylups, the repository flowable-bpmn-moddle and the
# workflow file publish.yml, and allow npm publish. npm also attaches a
# provenance statement to each version.

on:
  release:
    types: [ published ]

permissions:
  contents: read
  # lets npm exchange the run's OIDC token for a short-lived publish token
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # trusted publishing needs npm 11.5.1 or later, which Node 26 includes
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check that the release tag matches the package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "release tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run all

      - name: Show package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
